<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイム地震情報</title>
  <style>
    :root {
      --bg: #0a0e17;
      --panel: #121a27;
      --border: #1e2a3a;
      --text: #e8f0ff;
      --muted: #8a9bb0;
      --accent: #00c8ff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.4;
    }

    /* ヘッダー */
    header {
      background: linear-gradient(90deg, #0d1520, #152033);
      border-bottom: 2px solid var(--accent);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .title {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .title::before {
      content: "";
      display: inline-block;
      width: 12px;
      height: 12px;
      background: #ff3b3b;
      border-radius: 50%;
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .status {
      font-size: 0.95rem;
      color: var(--muted);
      text-align: right;
    }

    .status .live {
      color: #00ff9d;
      font-weight: bold;
    }

    /* メインレイアウト */
    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    /* 最新地震ハイライト */
    .latest {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    .latest::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 6px;
      height: 100%;
      background: var(--accent);
    }

    .latest-label {
      font-size: 0.85rem;
      color: var(--accent);
      letter-spacing: 0.15em;
      margin-bottom: 8px;
    }

    .latest-main {
      display: flex;
      flex-wrap: wrap;
      gap: 32px;
      align-items: center;
    }

    .intensity-box {
      width: 110px;
      height: 110px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-weight: 700;
      flex-shrink: 0;
    }

    .intensity-box .label {
      font-size: 0.8rem;
      opacity: 0.9;
    }

    .intensity-box .value {
      font-size: 2.4rem;
      line-height: 1;
    }

    .eq-info {
      flex: 1;
      min-width: 280px;
    }

    .eq-info h2 {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    .eq-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 16px 28px;
      font-size: 1.05rem;
      color: var(--muted);
    }

    .eq-meta span {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .eq-meta strong {
      color: var(--text);
      font-weight: 600;
    }

    /* リスト */
    .list-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .list-header {
      padding: 14px 20px;
      background: #0f1724;
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
      letter-spacing: 0.1em;
      color: var(--accent);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: #0d1520;
      padding: 12px 16px;
      text-align: left;
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tr:hover td {
      background: rgba(0, 200, 255, 0.05);
    }

    .scale-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 48px;
      height: 32px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .mag {
      font-weight: 700;
      font-size: 1.15rem;
      color: #ffd166;
    }

    .time {
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .place {
      font-weight: 500;
    }

    .depth {
      color: var(--muted);
    }

    /* 震度カラー */
    .s1  { background: #f2f2ff; color: #333; }
    .s2  { background: #00aaff; color: #fff; }
    .s3  { background: #0041ff; color: #fff; }
    .s4  { background: #fae696; color: #333; }
    .s5l { background: #ffe600; color: #333; }
    .s5u { background: #ff9900; color: #333; }
    .s6l { background: #ff2800; color: #fff; }
    .s6u { background: #a50021; color: #fff; }
    .s7  { background: #b40068; color: #fff; }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    .loading {
      text-align: center;
      padding: 60px;
      color: var(--muted);
    }

    .error {
      background: #3a1515;
      color: #ff8a8a;
      padding: 16px 20px;
      border-radius: 6px;
      margin-bottom: 16px;
    }

    @media (max-width: 700px) {
      .title { font-size: 1.25rem; }
      .latest-main { gap: 20px; }
      .intensity-box { width: 90px; height: 90px; }
      .intensity-box .value { font-size: 1.9rem; }
      .eq-info h2 { font-size: 1.4rem; }
      th, td { padding: 10px 12px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="title">防災センター風 リアルタイム地震情報</div>
    <div class="status">
      <div><span class="live">● LIVE</span> 自動更新中（約30秒）</div>
      <div id="lastUpdate">最終更新: --</div>
    </div>
  </header>

  <main>
    <div id="errorBox" class="error" style="display:none;"></div>

    <section class="latest" id="latestSection">
      <div class="latest-label">最新の地震情報</div>
      <div class="loading" id="latestLoading">データを取得しています…</div>
      <div class="latest-main" id="latestContent" style="display:none;">
        <div class="intensity-box" id="latestIntensity">
          <div class="label">最大震度</div>
          <div class="value" id="latestScale">-</div>
        </div>
        <div class="eq-info">
          <h2 id="latestPlace">-</h2>
          <div class="eq-meta">
            <span>発生時刻 <strong id="latestTime">-</strong></span>
            <span>マグニチュード <strong id="latestMag">-</strong></span>
            <span>深さ <strong id="latestDepth">-</strong></span>
            <span>津波 <strong id="latestTsunami">-</strong></span>
          </div>
        </div>
      </div>
    </section>

    <section class="list-panel">
      <div class="list-header">直近の地震情報一覧（最大20件）</div>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>発生時刻</th>
              <th>最大震度</th>
              <th>マグニチュード</th>
              <th>震源地</th>
              <th>深さ</th>
            </tr>
          </thead>
          <tbody id="eqList">
            <tr><td colspan="5" class="loading">読み込み中…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    データ提供：<a href="https://www.p2pquake.net/" target="_blank" rel="noopener">P2P地震情報</a>（気象庁発表データに基づく）　／　
    このページは防災情報の補助表示用です。正式な情報は気象庁・自治体の発表をご確認ください。
  </footer>

  <script>
    const API_URL = "https://api.p2pquake.net/v2/jma/quake?limit=20";
    const CORS_PROXY_URL = "https://api.allorigins.win/get?url=" + encodeURIComponent(API_URL);
    const REFRESH_MS = 30000;

    function showError(message) {
      const errorBox = document.getElementById("errorBox");
      errorBox.style.display = "block";
      errorBox.textContent = message;
    }

    function clearError() {
      const errorBox = document.getElementById("errorBox");
      errorBox.style.display = "none";
      errorBox.textContent = "";
    }

    function scaleToText(scale) {
      const map = {
        10: "1",
        20: "2",
        30: "3",
        40: "4",
        45: "5弱",
        50: "5強",
        55: "6弱",
        60: "6強",
        70: "7"
      };
      return map[scale] || "-";
    }

    function scaleToClass(scale) {
      if (scale >= 70) return "s7";
      if (scale >= 60) return "s6u";
      if (scale >= 55) return "s6l";
      if (scale >= 50) return "s5u";
      if (scale >= 45) return "s5l";
      if (scale >= 40) return "s4";
      if (scale >= 30) return "s3";
      if (scale >= 20) return "s2";
      if (scale >= 10) return "s1";
      return "";
    }

    function formatTime(str) {
      if (!str) return "-";
      return str.replace(/\//g, "-");
    }

    function tsunamiText(code) {
      const map = {
        "None": "なし",
        "Unknown": "不明",
        "Checking": "調査中",
        "NonEffective": "若干の海面変動",
        "Watch": "津波注意報",
        "Warning": "津波警報",
        "MajorWarning": "大津波警報"
      };
      return map[code] || code || "-";
    }

    async function fetchEarthquakeData() {
      const candidates = [API_URL, CORS_PROXY_URL];
      let lastError = null;

      for (const url of candidates) {
        try {
          const res = await fetch(url, {
            headers: { Accept: "application/json" }
          });

          if (!res.ok) {
            throw new Error("HTTP " + res.status + " " + res.statusText);
          }

          const text = await res.text();
          let data;

          try {
            data = JSON.parse(text);
          } catch {
            data = JSON.parse(text).contents || text;
          }

          if (data && data.contents) {
            data = JSON.parse(data.contents);
          }

          if (!Array.isArray(data) || data.length === 0) {
            throw new Error("データが空です");
          }

          return data;
        } catch (err) {
          lastError = err;
          console.warn("API fetch failed for:", url, err);
        }
      }

      throw lastError || new Error("地震データの取得に失敗しました");
    }

    async function fetchData() {
      clearError();

      try {
        const data = await fetchEarthquakeData();
        renderLatest(data[0]);
        renderList(data);

        document.getElementById("lastUpdate").textContent =
          "最終更新: " + new Date().toLocaleString("ja-JP");
      } catch (err) {
        console.error(err);
        showError("データの取得に失敗しました。しばらくして再試行します…\n(" + err.message + ")");
      }
    }

    function renderLatest(eq) {
      document.getElementById("latestLoading").style.display = "none";
      document.getElementById("latestContent").style.display = "flex";

      const scale = eq?.earthquake?.maxScale ?? 0;
      const scaleText = scaleToText(scale);
      const scaleClass = scaleToClass(scale);

      const box = document.getElementById("latestIntensity");
      box.className = "intensity-box " + scaleClass;
      document.getElementById("latestScale").textContent = scaleText;

      document.getElementById("latestPlace").textContent =
        eq?.earthquake?.hypocenter?.name || "不明";
      document.getElementById("latestTime").textContent =
        formatTime(eq?.earthquake?.time);
      document.getElementById("latestMag").textContent =
        eq?.earthquake?.hypocenter?.magnitude != null
          ? "M" + eq.earthquake.hypocenter.magnitude
          : "-";
      document.getElementById("latestDepth").textContent =
        eq?.earthquake?.hypocenter?.depth != null
          ? eq.earthquake.hypocenter.depth + " km"
          : "-";
      document.getElementById("latestTsunami").textContent =
        tsunamiText(eq?.earthquake?.domesticTsunami);
    }

    function renderList(list) {
      const tbody = document.getElementById("eqList");
      tbody.innerHTML = "";

      list.forEach(eq => {
        const scale = eq?.earthquake?.maxScale ?? 0;
        const scaleText = scaleToText(scale);
        const scaleClass = scaleToClass(scale);

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="time">${formatTime(eq?.earthquake?.time)}</td>
          <td><span class="scale-badge ${scaleClass}">${scaleText}</span></td>
          <td class="mag">${eq?.earthquake?.hypocenter?.magnitude != null ? "M" + eq.earthquake.hypocenter.magnitude : "-"}</td>
          <td class="place">${eq?.earthquake?.hypocenter?.name || "-"}</td>
          <td class="depth">${eq?.earthquake?.hypocenter?.depth != null ? eq.earthquake.hypocenter.depth + " km" : "-"}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    fetchData();
    setInterval(fetchData, REFRESH_MS);
  </script>
</body>
</html>
